<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Thai Trainer app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#071b33"/>
      <stop offset="1" stop-color="#04101f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#38bdf8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000814" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#7dd3fc" flood-opacity="0.20"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <text x="512" y="512" text-anchor="middle" dominant-baseline="central"
        font-family="Tahoma, Noto Sans Thai, Leelawadee UI, sans-serif"
        font-size="880" font-weight="800" fill="#7dd3fc" filter="url(#softShadow)">ก</text>
</svg>
